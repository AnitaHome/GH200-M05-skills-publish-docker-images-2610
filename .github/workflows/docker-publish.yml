name: Docker Publish

on:
  push:
    branches:
      - main

# 關鍵權限宣告：賦予 GITHUB_TOKEN 寫入 Packages 與讀取儲存庫內容的權限
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出原始碼
        uses: actions/checkout@v4

      - name: 登入 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 關鍵修正：將可能含有大寫字母的帳號與儲存庫名稱轉換為全小寫，防止 Buildx 報錯
      - name: 轉換儲存庫名稱為小寫
        run: |
          echo "IMAGE_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 設定 QEMU 模擬器 (支援多架構建置)
        uses: docker/setup-qemu-action@v3

      - name: 設定 Docker Buildx 建置引擎
        uses: docker/setup-buildx-action@v3

      - name: 建置並推送多架構映像檔 (Buildx)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/stackoverflown:main
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/stackoverflown:${{ github.sha }}